name: Notify docs repository

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  # Manual redeploy button.
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: liquidlab-agency/github-actions/import-app-credentials@1.0.1
        id: app-token
        with:
          vault-token: ${{ secrets.VAULT_TOKEN }}
          owner: liquidlab-agency
          repositories: docs

      - name: Trigger docs rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: liquidlab-agency/docs
          event-type: module-docs-updated
          client-payload: |
            {
              "module": "magento2-msi-removal",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}"
            }
